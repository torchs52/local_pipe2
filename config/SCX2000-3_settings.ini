[UI_IF]
camera_num = 3
camera0_name_l = Left
camera0_name_s = L
camera0_icon = L
camera1_name_l = Right
camera1_name_s = R
camera1_icon = R
camera2_name_l = Back Right
camera2_name_s = BR
camera2_icon = RB
camera3_name_l = Back Left
camera3_name_s = BL
camera3_icon = B

camera0_position = -3, 2, 4
camera0_rotation = 0, 0, -90
camera1_position = 3, 2, 4
camera1_rotation = 0, 0, 90
camera2_position = 1, -5, 3
camera2_rotation = 30, 0, 0
camera3_position = -1, -5, 3
camera3_rotation = 30, 0, 0

#z_offset = 0.368

z_offset = 1.65

crane_model = SCX2000-3

[General]
# CWから見た地面高さ
ground_height = -1.428
#ground_height = -1.65
#ground_height = -1.930
# 地面高さマージン
ground_height_margin = 0.45
# 旋回半径
rotation_radius = 6.2
# 点群の初期反転処理パラメータを格納したcsvファイル
#initial_transform_file = ./calibration/3d-3d/lidar_initial_pose_SCX20003.csv
initial_transform_file = ./calibration/3d-3d_trans_extra/lidar_initial_pose_SCX9003.csv
# プロセス名と対応する指定コア番号を格納した格納したjson
process_cpu_affinity_path = ${DEFAULT:config_dir}/cpu_affinity/SCX2000-3/process_cpu_affinity.json
enable_cpu_affinity = True

[StateEstimator]
window_sec = 0.5
delta_db = 0.05
p_on = 0.1
p_off = 0.05

[Lidar]
# 使用LiDARの数を設定
count = 2

[detect2d]
# core_path自体は参照していないが、その中にyolo関連の設定がある.
core_path = ./core/config.py
model_path = ./checkpoints/yolov4-tiny-416
yolo_class = ${DEFAULT:config_dir}/classes/coco.names
#onnx_model_path = ./checkpoints/yolov4_1_3_608_608_static.onnx
#onnx_model_path = ./checkpoints/yolov4_csp_normal_fix_1_3_608_608_static.onnx
#onnx_model_path = ./checkpoints/yolov4_tiny_normal_1_3_608_608_static.onnx
onnx_model_path = ./checkpoints/damoyolo_large.onnx
# YOLOv4の場合は下記を選択
#conf_thresh = 0.9
#nms_thresh = 0.45
# DAMO-YOLOの場合は下記を選択
conf_thresh = 0.7
nms_thresh = 0.5

use_onnx = True
is_DAMO_YOLO = True

[camera]
count = 3

[calibration]
# 各LiDARのcalibrationパラメーター格納ファイルへのPath
Lidar0  =  ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_0.csv
Lidar1  =  ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_1.csv
#Lidar0  =  ./calibration/3d-3d/lidar2crane_trans_mat_L.csv
#Lidar1  =  ./calibration/3d-3d/lidar2crane_trans_mat_R.csv
Lidar2  =  ./calibration/3d-3d/lidar2crane_trans_mat_L.csv
Lidar3  =  ./calibration/3d-3d/lidar2crane_trans_mat_R.csv
Lidar4  =  ./calibration/3d-3d/lidar2crane_trans_mat_L.csv
Lidar5  =  ./calibration/3d-3d/lidar2crane_trans_mat_R.csv
# 使用するLiDARのCalibファイルのPathをリストとして保持する。Main処理ではこのリストからPathを取得している
lidar_calib_files = [${calibration:Lidar0},${calibration:Lidar1}]

#暫定LiDAR位置, L,Rの順番、現在のカメラ位置は校正行列から生成される予定
#pos_lidar_L = [3.75, 1.97, 0.05]
#pos_lidar_R = [3.55, -2.01, 0.55]
lidar_position = ((3.75, -1.97, 0.05), (3.55, 2.01, 0.55))

[machine]
# path\d+とは違ってオフセット計算用に使っているので、一旦残しておく
path = ${DEFAULT:config_dir}/crane3d/visualize/${UI_IF:crane_model}/${UI_IF:crane_model}.obj
vis_machine_dir = ${DEFAULT:config_dir}/crane3d/visualize/${UI_IF:crane_model}
json_vis_machine_file = vis_machine_info.jsonc

[LiDARPosition]
# CWから見た地面高さ
ground_height = -0.95

[LiDARGrid]
# 安定化で使用するLiDARグリッドのパラメーター
side_max = 15
side_min = -15
fwd_max = 15
fwd_min = -15
grid_size = 0.5


[Accumulation]
# 安定化レジストレーション時に使用する点群範囲
registration_range = 15


[OctoTree]
# 機体点群の入ったディレクトリ
#col_machine_dir = ${DEFAULT:config_dir}/crane3d/collision_detection/${UI_IF:crane_model}/weighted
col_machine_dir = ${DEFAULT:config_dir}/crane3d/collision_detection/${UI_IF:crane_model}/lightning_v1
json_col_machine_file = col_machine_info.jsonc

# 八分木の実座標の最大xyz座標
max_xyz = [15,  15, 5]

# 八分木の実座標の最小xyz座標
min_xyz = [-15, -15, -5]

# 八分木の最大深さ
max_tree_depth = 8

# 機体点群からのマンハッタン距離がremove_dist以下の場合、lidar点群を除去する
remove_dist = 3

[CollisionDetection]
# 点群をどれだけ膨らませるか
dialate_point_size = 5

# 接触可能性探索の追加点群の最大高さ
detectable_height = 1.5
# 接触可能性探索の追加点群の高さのオフセット
detectable_ground_offset = -0.336

# 接触可能性探索の点の数, 動径方向, 角度方向, 高さ方向の分割数を表す
grid_intervals = (20, 80, 10)

# 接触可能性探索の動径方向の最小値
min_radius = 0.1

# 接触可能性探索の動径方向の最大値
max_radius = 7.0

# 可動部の見る角度の数
key_num = 64

[EdgeDetection]
# 鳥瞰図の画像の1画素の縦横の長さ[単位: m]
grid_size = (0.2, 0.2)

# 鳥瞰図のzの最小値
bev_min_z = -1.88

# 鳥瞰図のzの最大値
bev_max_z = -0.88

# 機体から何メートルの範囲まで検出するかを決めるための値
detect_range = (7.0, 7.0)
# 検出範囲のx方向y方向のオフセット, 各範囲で共通
detect_offset = (0.0, 1.0)

# 最小崖横幅[m]
edge_width = 1
