
[General]
initial_transform_file = ./calibration/3d-3d/lidar_initial_pose_SCX9003.csv

[DataCapture_Lidar]
count = 2

allow_lack = True
capture_latency_ms = 10

#各LiDAR個別の取得範囲制限
capturerange_x_max = 30
capturerange_x_min = -30
capturerange_y_max = 30
capturerange_y_min = -30
capturerange_z_max = 30
capturerange_z_min = -30

[DataCapture_Camera]
count = 3

framerate_div = 3

[DataConverter2D3D_Camera]
undistort_enable = True
intrinsics_path = ./calibration/camera_intrinsics_MCDE7180A.json

[DataConverter2D3D_Lidar]
sensors = 2
accumulate_length = 3

[Calib2d3d_General]
placeholder = 

[Calib2d3d_Proc2d]
intrinsics_path = ./calibration/camera_intrinsics_MCDE7180A.json
yolo_obj_countlimit = 50
yolo_type = DAMO-YOLO
yolo_modelpath = ./checkpoints/new_bench_full_20260625.onnx
conf_thresh = 0.5
nms_thresh = 0.45
camera_mask_images = [${DEFAULT:config_dir}/calibration_mat_generator_modules/camera_mask.png,${DEFAULT:config_dir}/calibration_mat_generator_modules/camera_mask.png,${DEFAULT:config_dir}/calibration_mat_generator_modules/camera_mask.png]
enable_bboxfilter_byimg = False
enable_edgebboxfilter = True
enable_imgmask = False
enable_bbox_shapefilter = False
enable_bbox2D_shapefilter = False
yolothreshold = 0.5
bbox_tracking_framelen_min = 50
bbox_tracking_movelen_pixels = 300
bbox_tracking_workarea2d_count = 20

lost_track_buffer = 30
tracking_frame_rate = 10.0
track_activation_threshold = 0.25
minimum_consecutive_frames = 3
minimum_iou_threshold = 0.3

cam_valmat_path = [${DEFAULT:config_dir}/calibration_mat_generator_modules/image_evaluation_value_FHD_origin960-923.npy,${DEFAULT:config_dir}/calibration_mat_generator_modules/image_evaluation_value_FHD_origin960-923.npy,${DEFAULT:config_dir}/calibration_mat_generator_modules/image_evaluation_value_FHD_origin960-923.npy]
# 設定値：入力座標(x_i,y_i) -> 参照座標(x_r,y_r) への一次変換係数
cam_valmat_coord_A_X = [1,1,1]
cam_valmat_coord_B_X = [0,0,0]
cam_valmat_coord_A_Y = [1,1,1]
cam_valmat_coord_B_Y = [0,0,0]


[Calib2d3d_Proc3d]
datarange_x_min = -15
datarange_x_max = 15
datarange_y_min = 0
datarange_y_max = 10
datarange_z_min = -0.88
datarange_z_max = 10
dbscan_eps = 0.5
dbscan_min_samples = 10
groundplane_ransac_coeff = 0.4
groundplane_ptthinning_div = 10
gplane_detection_walkingarea_limit = True
groundplane_requiredpoints = 30000
save_debugdata = False
enable_static_point_filter = True
static_point_filter_boxelsize = 1.0
static_point_filter_initlength = 6
static_point_filter_refresh_period = 100

bbox_tracking_framelen_min = 50
bbox_tracking_movelen_meters = 5.0
bbox_tracking_workarea3d_count = 20

lost_track_buffer = 60
tracking_frame_rate = 10.0
track_activation_threshold = 0.25
minimum_consecutive_frames = 10
minimum_iou_threshold = 0.001

is_headpoint_overwrite = True
calc_headpoint_pointrange_x_min = -10.0
calc_headpoint_pointrange_x_max = 10.0
calc_headpoint_pointrange_y_min = 3.0
calc_headpoint_pointrange_y_max = 10.0

is_footpoints_fixed = True
footpoints_zval = -1.36


[Calib2d3d_CalcProgress]
areadefinition_filepath_c0 = ${DEFAULT:config_dir}/calibration_mat_generator_modules/camera0_progressCalc_area.json
areadefinition_filepath_c1 = ${DEFAULT:config_dir}/calibration_mat_generator_modules/camera1_progressCalc_area.json
areadefinition_filepath_c2 = ${DEFAULT:config_dir}/calibration_mat_generator_modules/camera2_progressCalc_area.json
# 実際に読み込んでいるのはこちら↓
areadefinition_filepathes = [${Calib2d3d_CalcProgress:areadefinition_filepath_c0},${Calib2d3d_CalcProgress:areadefinition_filepath_c1},${Calib2d3d_CalcProgress:areadefinition_filepath_c2}]
progress_threshold = 0.7

# サブブロック進捗表示出力の上書きソース（none/block/group。規定値group）
subblock_overwrite_src = block

[Calib2d3d_CalcCorrespondence]
postprocess_mat = ${DEFAULT:config_dir}/calibration_mat_generator_modules/Rxinv_mat.txt
#校正計算方法　old（従来通りのopencv solvePnP/PnPRansac） / opt（最適化を使った手法）
calcmethod = opt

#mode [C,X][Y,L,E,N] C:bbox中心 X:頭・足座標 Y:全有効 L:エリア内有効 E:エリア内無効 N:無効 CL-XEのように使用(内部的には文字列検索)
corrpoint_mode = CL-XE
enable_recalc_center3d_z = True

use_centerpoint_x_min = [-6, 3.3, -6]
use_centerpoint_x_max = [14, 7.3, 14]
use_centerpoint_y_min = [2.075, -10.0, -5.075]
use_centerpoint_y_max = [5.075, 10.0, -2.075]


[Calib3d3d_SimParams]
# シミュレーションにおけるLiDAR計測範囲[m]
max_range = 10.0
# LiDARの種類(airy or mid360): mid360しか使わない
lidar_type = mid360

# 回転式LiDAR用パラメータ(今はAiry用だが、OS0やQT128もパラメータを変えたら対応可能)
rays_az = 240
rays_el = 120
vfov = [-90.0, 90.0]

# mid360の配光パターンを保存したCSV
mid360_laser_pattern_path = ${DEFAULT:config_dir}/calibration_mat_generator_modules/laser_pattern/mid360.csv
# 上の配光パターンを何秒分読み込むか（最大8秒）
points_accum_time = 8

[CalibCheck2d3d]
onnx_model_path = ./checkpoints/new_bench_full_20260625.onnx
camera_intrinsics_path = "./calibration/camera_intrinsics_MCDE7180A.json"

lidar_calib_files = [${Filepath_IO:CalibCheck3d3dmat_lid0},${Filepath_IO:CalibCheck3d3dmat_lid1}]
camera_calib_files = [${Filepath_IO:CalibCheck2d3dmat_cam0},${Filepath_IO:CalibCheck2d3dmat_cam1},${Filepath_IO:CalibCheck2d3dmat_cam2}]
new_axis_mode = True
image_w = 1920
image_h = 1080
z_threshold = -1.0
camera_count = 3
score_accept_count_threshold = 5
score_value_threshold = 0.10
resultfiles = [${Filepath_IO:resultfiles_camera0},${Filepath_IO:resultfiles_camera1},${Filepath_IO:resultfiles_camera2}]
