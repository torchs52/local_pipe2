# 処理時間充分遅い閾値(継続するとinformation表示)
slow_th_ms = 5000.0
# 短期average取得期間
short_que = 10
# 長期average取得期間
long_que = 100
# GetDataProcessループの待機時間[s]
get_data_sleep_sec = 0.3

[CAN]
# CAN信号関連の定数
#path = ${DEFAULT:config_dir}/can_one_matsunaga.json
config_file = ${DEFAULT:config_dir}/can_etherCAN.json
# 角度情報: True: 旧版使用, False: 新版使用
IsOld = False
# ファイル保存の角度を使う(=0)か、msgを再解釈する(=1)か
# オフセットと旧版の逆角度対応は=1
interpretation = 1
# 旋回角信号のオフセット[単位: degree]
# oldcan: 旧版用オフセット、 newcan: 新版用オフセット
#yaw_offset_deg_oldcan = 141.8
yaw_offset_deg = 0
c_file = ${DEFAULT:data_dir}/大府実験2403/10fps/${Lidar:date_str}/can_${Lidar:date_str}.csv
#c_file = ${DEFAULT:data_dir}/ohbu202510/convvideo_can10fpssync/can_${Lidar:date_str}.csv
#c_file = ${DEFAULT:data_dir}/大府実験2502/recdata/can_${Lidar:date_str}.csv
