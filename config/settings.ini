#date_str = 20240314_130128
date_str = 20240314_134621
#date_str = 20250204_164456
#date_str = cap_0204_cam120250204_164456ts.csv

#lidar0_file = ${DEFAULT:data_dir}/ohbu202510/convpoint/${date_str}/0/point_
#lidar1_file = ${DEFAULT:data_dir}/ohbu202510/convpoint/${date_str}/1/point_
#lidar0_file = ${DEFAULT:data_dir}/大府実験2502/convpoint/${date_str}/lidarL/lidarL_
#lidar1_file = ${DEFAULT:data_dir}/大府実験2502/convpoint/${date_str}/lidarR/lidarR_
lidar0_file = ${DEFAULT:data_dir}/大府実験2403/10fps/${date_str}/Lpoints/Lpoint_
lidar1_file = ${DEFAULT:data_dir}/大府実験2403/10fps/${date_str}/Rpoints/Rpoint_
lidar2_file = ${DEFAULT:data_dir}/大府実験2403/10fps/${date_str}/Lpoints/Lpoint_
lidar3_file = ${DEFAULT:data_dir}/大府実験2403/10fps/${date_str}/Rpoints/Rpoint_
