# 格子の色
grid_color = (0, 0, 0)

[JetsonMonitor]
isApplied = False
settings_ini = ${DEFAULT:config_dir}/jetson_monitor/test_jm_settings.ini
interval = 0.1
write_interval = 1.0
window_sec = 600
metrics_path = ${DEFAULT:mmap_dir}/metrics_latest.txt
log_jsonl_ts_name = True
jsonl_rotate_mb = 50
jsonl_rotate_keep = 10
disk_guard_gib = 0.1
