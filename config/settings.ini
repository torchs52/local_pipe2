can_id_map_file = ${DEFAULT:config_dir}/can_id_map.csv

[StateEstimator]
window_sec = 0.5
delta_db = 0.05
p_on = 0.1
p_off = 0.05

[Lidar]
# 使用LiDARの数を設定
count = 2
# LiDAR設定ファイルへのPath。２つあるので統一したい
path = ${DEFAULT:config_dir}/config_lidars.json
config_file = ${DEFAULT:config_dir}/lidar.json
# 1フレームに使用する点群の蓄積秒数
accum_time = 0.1

# 読み込みファイル名情報
