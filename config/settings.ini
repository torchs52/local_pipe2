Lidar4_points = ${eval_general:fdir}/大府実験2403/10fps/${eval_general:fname}/Rpoints/Rpoint_

[eval_collision]
# 衝突判定評価用の定数

# この機能を使う場合は、True, 使わない場合はFalseにする
func_on = False

# 衝突判定で機体からどこまでを評価するか, x方向, y方向の距離[m]を指定
detect_range = (5, 5)

# 衝突判定の格子のx,yの幅[m]
grid_size = (0.5, 0.5)

# 格子の高さは機体の最小値からheight_offsetだけ下のところとする
