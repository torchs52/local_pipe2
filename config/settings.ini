# WSL環境用

[DEFAULT]
# ルートディレクトリ: config_dir / log_dir / mmap_dir は CLI引数で上書きされる。
config_dir = /opt/argus3d/config/core
log_dir = /var/log/argus3d
#log_dir = /media/shiuser/ボリューム/X6T304
mmap_dir = /dev/shm
# 現状は home_dir の設定不要.
home_dir = /U
# my_dir = ${home_dir}/mydir
# sensor から読み込む時はFalse
File_Input = True
debug_log = ${DEFAULT:log_dir}/argus3d_core.log
#data_dir = /media/fmt_nakamura/ST8000DM004_HDD/X2050029
data_dir = /mnt/nvme
#data_dir = /media/shiusesubgrid_sr/testdata
#data_dir = D:/data/X6T405
#data_dir = /media/shi/ボリューム/X6T304
print_disabled = True
#センサライブラリ使用するか
use_shi_lib = False

[General]
# 工場出荷時
in_factory = False
# 動作モード (0:周辺監視, 1: 校正)
operation_mode = 0
# 外部安全器具の設置
has_external_guard = False
external_guard_offset = 0
# CWから見た地面高さ
ground_height = -1.365
# 地面高さマージン
ground_height_margin = 0.45
# 旋回半径
rotation_radius = 4.2
# 点群の初期反転処理パラメータを格納したcsvファイル
initial_transform_file = ./calibration/3d-3d_trans_extra/lidar_initial_pose_SCX9003.csv
# プロセス名と対応する指定コア番号を格納した格納したjson
process_cpu_affinity_path = ${DEFAULT:config_dir}/cpu_affinity/SCX900-3/process_cpu_affinity.json
enable_cpu_affinity = True

[CalibMode]
# このファイルに含めるか等要検討
# 3D3D校正　（センサ校正） T/F
isRunning3D3Dcalib = False
# 2D3D校正　（カメラ校正） T/F, カメラ番号指定(0-2), 校正計算開始トリガー
isRunning2D3Dcalib = False
cameraID = 2
start2D3DCalibCalc = False

# カメラずれチェック（カメラ校正要否判定） T/F
isRunning2D3Dcheck = False
start2D3DCheckCalc = False
# インターフェースデバッグモード T/F 本番では削除することになるかも
isRunningInterfaceDebug = False
show_trajectory = True

[UI_IF]
crane_model = SCX900-3
godot_ui = True
UI_mmap = [${DEFAULT:mmap_dir}/map0.dat,${DEFAULT:mmap_dir}/map1.dat]
damp_out = False
damp_mmap = [${DEFAULT:mmap_dir}/damp_hex0.txt,${DEFAULT:mmap_dir}/damp_hex1.txt]
bbox_3d_num = 20
bbox_3d_distance = 8
show_unk = True
collision_depict_dist = 4.0
collision_attention_dist = 3.0
collision_warning_dist = 1.5
cliff_attention_dist = 6.0
cliff_warning_dist = 3.0
draw_bbox_3d = False
draw_collision = True

[CalibUI_IF]
godot_ui = True
UI_mmap = [${DEFAULT:mmap_dir}/map_c0.dat,${DEFAULT:mmap_dir}/map_c1.dat]
damp_out = True
damp_mmap = [${DEFAULT:mmap_dir}/damp_hex_c0.txt,${DEFAULT:mmap_dir}/damp_hex_c1.txt]
mmap_assign_json_path = ${DEFAULT:config_dir}/calibration_mat_generator_modules/mmap_assign.json
subblock_size_xy = 1, 1
show_trajectory = True
show_image2d3d = True

[AppManager]
logmode = 0
logtime = 4294967295
interval = 0.5
JudegeStopThr = 150
monitor_argus_last_heartbeat_path = ${DEFAULT:mmap_dir}/monitor_argus_last_heartbeat

# log_dir は ${DEFAULT:log_dir} を AppConfig が使用
log_dir = ${DEFAULT:log_dir}

[Monitor]
# どのカメラ映像を表示するか
show_cam = [1, 1, 1]
# 画像サイズの除算係数
coeff = 2
save_cam = 0

[Scrutinizer]
