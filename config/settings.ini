#lidar1_file = ${DEFAULT:data_dir}/experiment2025/ohbu20250205/convpoint/cap_0205_cam120250205_150121ts.csv/R/Rpoint_
lidar_files = [${lidar0_file},${lidar1_file}]

[detect3d]
# クラスター半径[m]
eps = 0.4
# クラスターを形成可能な最小点群数
min_samples = 5

[detect2d]
isApplied = True
# core_path自体は参照していないが、その中にyolo関連の設定がある.
core_path = ./core/config.py
model_path = ./checkpoints/yolov4-tiny-416
yolo_class = ${DEFAULT:config_dir}/classes/coco.names
#onnx_model_path = ./checkpoints/yolov4_1_3_608_608_static.onnx
#onnx_model_path = ./checkpoints/yolov4_csp_normal_fix_1_3_608_608_static.onnx
#onnx_model_path = ./checkpoints/yolov4_tiny_normal_1_3_608_608_static.onnx
onnx_model_path = ./checkpoints/damoyolo_large.onnx
# YOLOv4の場合は下記を選択
#conf_thresh = 0.9
#nms_thresh = 0.45
# DAMO-YOLOの場合は下記を選択
conf_thresh = 0.7
nms_thresh = 0.5

use_onnx = True
is_DAMO_YOLO = True

[camera]
count = 3
#ライブラリ設定ファイル
config_file = ${DEFAULT:config_dir}/camera_three.json
# core_path自体は参照していないが、その中にyolo関連の設定がある.
#core_path = ./core/config.py
#model_path = ./checkpoints/yolov4-tiny-416
#yolo_class = ${DEFAULT:config_dir}/classes/coco.names
MOTEC = True
#入力ビデオorカメラサイズ
video_width = 1280
video_height = 720
#システム上の画像サイズ(Cameraクラスの責任でこのサイズに合わせられる)
sys_width = 1280
sys_height = 720
# 歪み補正バックエンド選択: auto / cpu / cuda
undistort_backend = auto
#width = 640
#height = 480
porttable = [10750,10760,10770]
iptable = [192.168.1.75,192.168.1.76,192.168.1.77]


[calibration]
calib_lidar2crane = True
BothLidars = ./calibration/3d-3d/lidar2lidar_trans_mat_MID360.csv
calib3d3d_id = O2502046

# 各LiDARのcalibrationパラメーター格納ファイルへのPath
#Lidar0 = ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_0.csv
#Lidar1 = ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_1.csv
#Lidar0 = ./calibration/3d-3d/${calibration:calib3d3d_id}/lidar2crane_trans_mat_L.csv
#Lidar1 = ./calibration/3d-3d/${calibration:calib3d3d_id}/lidar2crane_trans_mat_R.csv
#Lidar0 = ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_0.csv
#Lidar1 = ./calibration/3d-3d/${UI_IF:crane_model}/lidar2crane_trans_mat_1.csv
Lidar2 = ./calibration/3d-3d/lidar2crane_trans_mat_0.csv
Lidar3 = ./calibration/3d-3d/lidar2crane_trans_mat_1.csv
Lidar4 = ./calibration/3d-3d/lidar2crane_trans_mat_0.csv
Lidar5 = ./calibration/3d-3d/lidar2crane_trans_mat_1.csv
#周辺監視用3D3D校正行列保存先（GodotUI書き込み先）
Lidar0 = ./calibration/3d-3d/lidar2crane_trans_mat_0.csv
Lidar1 = ./calibration/3d-3d/lidar2crane_trans_mat_1.csv
# 使用するLiDARのCalibファイルのPathをリストとして保持する。Main処理ではこのリストからPathを取得している
lidar_calib_files = [${calibration:Lidar0},${calibration:Lidar1}]
#BothLidars  =  ./calibration/3d-3d/lidar2lidar_trans_mat_OS0.csv
mtx_file = ./calibration/mtx.npy
dist_file = ./calibration/dist.npy
#list_files = ./calibration/2d-3d/*.csv

calib2d3d_id = O2502060
#list_0_files = ./calibration/2d-3d/${calibration:calib2d3d_id}/0/*.csv
#list_1_files = ./calibration/2d-3d/${calibration:calib2d3d_id}/1/*.csv
#list_2_files = ./calibration/2d-3d/${calibration:calib2d3d_id}/2/*.csv
#周辺監視用2D3D校正行列保存先（GodotUI書き込み先）
list_0_files = ./calibration/2d-3d/camera0transmat.csv
list_1_files = ./calibration/2d-3d/camera1transmat.csv
list_2_files = ./calibration/2d-3d/camera2transmat.csv
fisheye_param_file = ./calibration/camera_intrinsics_MCDE7180A.json

#センサ位置計算のためのパラメータ
center_rotate = (0.0, 0.0, 0.0)
center_shift = (3.5, 0.0, 0.0)

#暫定カメラ位置(SCX-900、CW全段ありの場合)、L,C,Rの順番、現在のカメラ位置は校正行列から生成される予定
#pos_cam_L = [3.26850145, 1.98556209, 1.86248422]
#pos_cam_C = [4.21117544, 0.10067892, 1.659639]
#pos_cam_R = [3.35044798, -2.08905745, 2.05906677]
camera_position = ((3.26850145, -1.98556209, 1.86248422),(4.21117544, -0.10067892, 1.659639),(3.35044798, 2.08905745, 2.05906677))

#暫定LiDAR位置, L,Rの順番、現在のカメラ位置は校正行列から生成される予定
#pos_lidar_L = [3.75, 1.97, 0.05]
#pos_lidar_R = [3.55, -2.01, 0.55]
lidar_position = ((3.75, -1.97, 0.05), (3.55, 2.01, 0.55))

# LiDARズレ検出用パラメータへのPath。IMUの基準状態を記録。3D-3D Calibrationと同時に実施する
imu_baselines_file = ./calibration/3d-3d/lidar_shift_detection_baselines.csv

[machine]
path = ${DEFAULT:config_dir}/crane3d/visualize/${UI_IF:crane_model}/${UI_IF:crane_model}.obj
vis_machine_dir = ${DEFAULT:config_dir}/crane3d/visualize/${UI_IF:crane_model}
json_vis_machine_file = vis_machine_info.jsonc

# 旋回中心のオフセット, いずれ旋回中心が原点になるので、不要になるが、今はいるので設定ファイルに追加
offset_rotate_center = (0,0,0)

[LiDARPosition]
x_offset = 0.0
y_offset = 0.0
z_offset = 0.0
x_reverse = True
y_reverse = True
z_reverse = False

[LiDARGrid]
# 安定化で使用するLiDARグリッドのパラメーター
side_max = 15
side_min = -15
fwd_max = 15
fwd_min = -15
grid_size = 0.5

[Accumulation]
accum_point = True
# 起動から(num_skip_registration_frames)フレーム分は静止しているとして、レジストレーションせずに蓄積する
num_skip_registration_frames = 10
# registartion用methodを次から選択 => icp, multi_icp, ndt
registration_methods = multi_icp
# 点数がthr_skip_points以下のフレームはaccumulationをスキップ
thr_skip_points = 100
# 安定化レジストレーション時に使用する点群範囲
registration_range = 15
# 安定化レジストレーション時に使用するdownsampleサイズ
voxel_down_sample = 0.25
# 安定化レジストレーション時: multi_icpとicpのボクセルサイズリスト
# 注意: voxel_size_for_multi_icpとcorrespondence_distancesの要素数は等しくする
voxel_size_for_multi_icp = [0.5,0.25,0.1]
# 安定化レジストレーション時: multi_icpの探索範囲リスト
correspondence_distances = [0.75,0.35,0.15]
# 安定化立体物点群に対するダウンサンプルサイズ
voxel_size_for_accumulated_points = 0.05
# voxel_size_for_accumulated_points = 0.12
voxel_size_for_accumulated_points_reduced_load = 0.12
# 安定化地面点群に対するダウンサンプルサイズ
voxel_size_for_accumulated_ground_points = 0.05
# voxel_size_for_accumulated_ground_points = 0.12
voxel_size_for_accumulated_ground_points_reduced_load = 0.12
# 点群が観測された占有のセルに対してカウンターを増やすときの値
increment_accum_counter = 2
# 点群が観測されなかったセルに対してカウンターを減らすときの値
decrement_accum_counter = 6
# 非占有のセルで、decrement_accum_counterを始めるかどうかを判定するための閾値。カウンターがこの値より大きいときは大きな値で減衰を行う
decrement_speed_threshold = 10
# counter <= 10 のときに一度に減らす量。
decrement_accum_counter_slow = 1
# そのセルのカウンターがこの閾値以上なら prob_present=1.0（占有確信）とみなすための値
prob_present_threshold = 13
# カウンターがこの値（-10）より低くなるとき、負のまま放置せずに一律で 0 にリセットするための閾値
accum_counter_lower_reset_threshold = -10
# 点群が観測されなかったとき、カウンターを減算する前に上限として設定する閾値
accum_counter_max_cap = 30
# 立体物点群安定化で使用するフレーム数
max_accumulated_frames = 30
# max_accumulated_frames = 5
max_accumulated_frames_reduced_load = 5
# 地面物点群安定化で使用するフレーム数
max_accumulated_frames_ground = 30
# max_accumulated_frames_ground = 5
max_accumulated_frames_ground_reduced_load = 5

[OctoTree]
func_on = True
col_machine_dir = ${DEFAULT:config_dir}/crane3d/collision_detection/${UI_IF:crane_model}/lightning_v3
json_col_machine_file = col_machine_info.jsonc
max_xyz = [15,  15, 5]
min_xyz = [-15, -15, -5]
max_tree_depth = 8
# 機体点群からのマンハッタン距離がremove_dist以下の場合、lidar点群を除去する
remove_dist = 3
# クラスタリング時にclustering_tree_depthの階層のデータでクラスタリングを行う
clustering_tree_depth = 8

# 統計量の計算に少ないが時間がかかるので、統計量を使って処理しない場合はFalseにしたほうが早い
use_node_stats = True

[CollisionDetection]
# この機能を使用する場合、必ず[OctoTree][func_on]=Trueにする
func_on = True
# 衝突判定のインスタンスを表す文字列
collision_detector_name = LayerBasedCollisionDetector
# 衝突判定で点群を膨張させるので、膨張させる大きさを表すパラメータ
#dialate_point_size = 2
dialate_point_size = 5
# 2つの点群間の衝突判定時、distance_threshold以下の組が存在しない場合、衝突したとみなさない
distance_threshold = 10.0
# 衝突判定対象の範囲[単位: m], 機体点群の最小、最大の外側で、この範囲だけ外側を衝突判定として見に行く
detect_focus_range = [3.0,3.0,3.0]
# 距離計算に用いるセルの代表点, MEAN: セル内の点群の平均, VOX_MED: セルの中心座標, FAR_POINT, NEAR_POINT
coord_method = MEAN

# 接触可能性探索の検出範囲
max_dist = 2
#max_dist = 8.67

# 接触可能性探索の追加点群の最大高さ
detectable_height = 1.5
# 接触可能性探索の追加点群の高さのオフセット
#detectable_ground_offset = -0.1005
detectable_ground_offset = -0.336

# 接触可能性探索の点の数, 動径方向, 角度方向, 高さ方向の分割数を表す
#grid_intervals = (30, 40, 10)
grid_intervals = (20, 80, 10)

min_radius = 0.1
#max_radius = 12.0
max_radius = 7.0

# 可動部の見る角度の数
key_num = 8

[SceneDescription]
# --- 粗ゲート（h3d/h2d）---
#0.22→0.20：しゃがみ/遠方の下振れを拾う
coarse_lo = 0.2
#2.20→2.40：歩行スミア等の縦伸びを許容
coarse_hi = 2.40
#0.22→0.20：小さなBBoxで緩和を強める
k_min = 0.20
#110→120：遠方（小箱）側で緩めに働く
h_ref_px = 120
#0.70→0.65：下側の許容量をもう少し増やす
lo_gain = 0.65
#1.25→1.30：上側の許容量をもう少し増やす
hi_gain = 1.30
#0.12→0.10：小さなBBoxで緩和を強める
lo_floor = 0.10
#3.80→4.20：大きなBBoxで緩和を強める
hi_ceil = 4.20

# --- 縦ペナルティ（ソフト）---
#0.8→0.9：IoU重視を少し上げる
vertical_w_iou = 0.9
#0.8→0.9：縦スケールずれの抑止を少し上げる
vertical_w_scale = 0.9
#0.7→0.8：縦位置ずれの抑止を少し上げる
vertical_w_phi = 0.8

# --- 最終コストの保険（極端な外れを切る）---
#緩めの2.0
final_threshold = 2.0

# --- 人サイズ（今回はOFFでOK）---
use_human_gate = False
H_min = 0.85
H_max = 2.40
W_min = 0.15
W_max = 1.50
D_min = 0.15
D_max = 1.50
tall_ratio_min = 1.10

[Visualizer]
# False: 点群の代わりに箱オブジェクトが表示される
display_point = False
# 箱のサイズ指定[m]
box_size = 0.12
# True: CAN旋回角に合わせてグリッドを回転
rotate_grid = False
# save_vis=0: 保存しない、1: フレームごとに画像として保存, 2: 動画として保存
save_vis = 0
save_dir_path = ${DEFAULT:data_dir}/saved_vis_image/${Lidar:date_str}/
#save_dir_path = ${DEFAULT:data_dir}/大府実験2403/saved_vis_image/${Lidar:date_str}/
#save_dir_path = ${DEFAULT:data_dir}/大府実験2502/saved_vis_image/${Lidar:date_str}/
coeff = 4
# 衝突箇所のshere size
radius = 0.2
# 八分木の表示の有無
display_octree = False
# 八分木結果の表示方法, around: 点群の存在する箇所の八分木を表示する, all: 全ての八分木のセルを表示する
display_octree_method = around

[EdgeDetection]
# 崖検出インスタンスを指定, possible: EdgeDetction, MultiEdgeDetection, EdgeDetectionPolar
# EdgeDetectionPolarが最新の手法で、他は古いので適宜エラー修正が必要になると思われる
detector = EdgeDetectionPolar
isApplied = False
# possible: PRODUCT, DEBUG
func_mode = PRODUCT
resolution = 0.1

# 崖一辺のxyの長さ[m]
grid_size = (0.1171875, 0.1171875)

# 注目領域の設定[m], 過去の名残で残しているが、いずれ消す
side_range = (-10,10)
# 注目領域の設定[m], 過去の名残で残しているが、いずれ消す
fwd_range = (2,10)

# 鳥瞰図のzの最小値
bev_min_z = -1.88

# 鳥瞰図のzの最大値
bev_max_z = -0.88

# 点群の大きさを制御する
voxel_size = 0.2

# 注目領域の範囲計算の方法
range_properties = [BACK,LEFT,RIGHT]

# 機体から何メートルの範囲まで検出するかを決めるための値
detect_range = (7.0, 7.0)
# 検出範囲のx方向y方向のオフセット, 各範囲で共通
detect_offset = (0.0, 1.0)
# 短冊の高さ設定[m]
height_strip = 3
# 最小崖横幅[m]
edge_width = 5.0

# 極座標の原点
polar_origin = (0.0,0.0,0.0)

# 極座標の鳥瞰図の格子数, (動径方向, 角度方向)の順で値が入っている
polar_shape = (128,1024)

# 動径方向が0付近は点群が安定しないので、動径方向のどこから検知を始めるかを表す数値
polar_min_radius = 1.14

# 機体死角に対応する点群のラベル番号
machine_occ_label = 0

# 動径方向の検出範囲を最大値からどれだけ小さくするか
# エッジを膨らませたりするので、最大値より手前に検出境界によって区切れて存在するエッジがあることがあるので、それを抑制するためのオフセット
search_radius_offset = 8

# 各崖エッジの長さがこれより小さい場合は崖検知の結果として出力されない
target_edge_dist_th = 2.0

# デバッグの有無
debug = False
edge_z_offset = 2.4
remove_duplicate_label = True

# 評価用に追加
# 2値化の閾値
bin_th = 110

# オクルージョン判定の窓のサイズ
occ_focus_range = 50

# エッジ画像のフィルタサイズ
edge_filter_size = 3

[LiDARShiftMonitor]
# 定常ズレ
# 長窓サイズ（例: 200=1s@200Hz）
win = 200
hold = 100
thr_slow = 1000.1
has_not_calibrated_path = ${DEFAULT:log_dir}/has_not_calibrated.txt

# 瞬間ズレ
# 窓とするフレーム数：今は使っていない
win_fast = 5
# 連続してhold_fastの回数だけズレがしきい値を超えたらズレTrueとする
hold_fast = 2
# 計算方法: 0.01秒で5度ズレ検出を想定。11.3388 = ((5*(1/0.01)*3.14)/180)*1.3 (1.3はマージン値（決め打ち)）
thr_fast = 2.26

# 入力
num_sample_k = 20
dt = 0.005

# 重力加速度(今は使っていない)
g_mag = 9.98

[debug]
# 各アルゴリズムの処理時間をcsvで出力
record_time = False
# csvを保存するフォルダを指定
record_time_folder_path = ../processing_time/
# カメラ画像にYOLO結果も重畳表示
draw_yolo = True

# 評価用のデータとパラメータ設定
[eval_general]
evaluation_mode = False
number_of_frames_used = 20
fdir = ..
fname = 20240314_134621

[eval_calib]
Lidar1_calib = ./calibration/3d-3d/lidar2crane_trans_mat_0.csv
