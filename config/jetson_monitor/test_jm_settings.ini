# =========================================
# Jetson Monitor settings.ini (test)
# =========================================

[paths]
raw_out = __TEST_OUT_BASE__/tegrastats_latest.txt
default_metrics_out = __TEST_OUT_BASE__/metrics_latest.txt
log_jsonl_out = __TEST_OUT_BASE__/metrics.jsonl
godot_json_out = __TEST_OUT_BASE__/metrics_snapshot.json

[throttle]
tj_th_c = 82.0
cpu_load_th = 40.0
gpu_load_th = 40.0
cpu_freq_drop_ratio = 0.80
gpu_freq_drop_ratio = 0.80

[health]
tj_warn_low = 75.0
tj_warn = 82.0
tj_critical = 90.0

thr_any_min_s = 10

cpu_throttle_drop_ratio = 0.70
gpu_throttle_drop_ratio = 0.75

cpu_warn_drop_ratio = 0.80
gpu_warn_drop_ratio = 0.80

cpu_load_high = 50.0
gr3d_high = 50.0